[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mfgb-flow-routing"
version = "0.1.0"
description = "Multi-Factor Game-Based flow routing for digital elevation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = ["numpy>=1.24,<3.0"]

[project.optional-dependencies]
calibration = ["bayesian-optimization>=1.4"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

